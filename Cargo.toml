[package]
name = "pts_board"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread"] }
axum = "0.8.6"
tower-http = { version = "0.6.6", features = ["fs"] }
sea-orm = { version = "1.1.16", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.15.0"
chrono = "0.4.42"
rand = "0.9.2"
askama = "0.14.0"
