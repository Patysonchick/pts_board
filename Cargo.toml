[package]
name = "pts_board"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
axum = "0.8.6"
tower-http = { version = "0.6.6", features = ["trace", "fs"] }
sea-orm = { version = "1.1.16", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
migration = { path = "migration" }
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.15.0"
chrono = "0.4.42"
rand = "0.9.2"
askama = "0.14.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
dotenvy = "0.15.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
