<div class="thread" id="thread-{{ thread.id }}">
    <div class="thread-header">
        <a href="/thread/{{ thread.id }}" rel="noopener noreferrer" target="_blank">№{{ thread.id }}</a>
        {% if let Some(title) = thread.title %}
        <span>{{ title }}</span>
        {% endif %}
    </div>
    <div class="thread-body">
        <p>{{ thread.text }}</p>
    </div>

    {% for post in posts %}
    {% include "post.html" %}
    {% endfor %}
</div>
